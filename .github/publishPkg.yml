name: publish package

on:
    release:
      types: [created]

jobs:
    publish-pkg:
      runs-on: ubuntu latest
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v7
        - uses: actions/steup-node@v6
          with:
            node-version: 24
            registry-url: 'https:npm.pkg.github.com'
            scope: '@BiancaIchim'
        - run: npm ci
        - run: npm publish
          env:
            NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
